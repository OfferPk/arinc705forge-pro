<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#0a0e17"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="920" height="45" rx="6" fill="#111827" stroke="#2e3b52"/>
  <text x="35" y="48" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">ARINC705Forge Pro &mdash; AHRS Avionics Sensor &amp; Slaving Engineering Studio</text>
  <rect x="750" y="30" width="170" height="25" rx="12" fill="rgba(34,197,94,0.2)" stroke="#22c55e"/>
  <text x="765" y="47" font-family="monospace" font-size="11" font-weight="bold" fill="#4ade80">100% COMPLIANT</text>

  <!-- Left: Flight Instrument Display (ADI & HSI) -->
  <rect x="20" y="80" width="380" height="440" rx="8" fill="#000000" stroke="#1f2937" stroke-width="2"/>
  <text x="35" y="105" font-family="monospace" font-size="11" font-weight="bold" fill="#cbd5e1">PRIMARY FLIGHT ATTITUDE &amp; HEADING (AHRS 1)</text>

  <!-- ADI Horizon -->
  <rect x="35" y="120" width="350" height="150" rx="4" fill="#0284c7"/>
  <rect x="35" y="195" width="350" height="75" rx="4" fill="#78350f"/>
  <line x1="35" y1="195" x2="385" y2="195" stroke="#ffffff" stroke-width="2"/>

  <!-- Aircraft Symbol -->
  <line x1="160" y1="195" x2="195" y2="195" stroke="#ffb800" stroke-width="3.5"/>
  <line x1="225" y1="195" x2="260" y2="195" stroke="#ffb800" stroke-width="3.5"/>
  <circle cx="210" cy="195" r="3" fill="#ffb800"/>

  <!-- HSI Compass Rose -->
  <rect x="35" y="285" width="350" height="140" rx="4" fill="#070d18" stroke="#1e293b"/>
  <circle cx="210" cy="355" r="50" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="206" y="318" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">N</text>
  <text x="250" y="358" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">E</text>
  <text x="206" y="398" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">S</text>
  <text x="165" y="358" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">W</text>
  
  <!-- Lubber line & Heading Box -->
  <rect x="180" y="340" width="60" height="25" rx="4" fill="#0b1320" stroke="#38bdf8"/>
  <text x="192" y="357" font-family="monospace" font-size="14" font-weight="bold" fill="#ffb800">270°</text>

  <!-- Mode banner -->
  <rect x="35" y="435" width="350" height="35" rx="4" fill="#1e293b"/>
  <text x="50" y="457" font-family="monospace" font-size="11" fill="#4ade80">MODE: SLAVED &bull; TRUE HDG: 266.5° &bull; VAR: -3.5°</text>

  <rect x="35" y="478" width="170" height="30" rx="4" fill="#065f46" stroke="#10b981"/>
  <text x="75" y="497" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">SLAVED MODE</text>
  <rect x="215" y="478" width="170" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="255" y="497" font-family="monospace" font-size="10" fill="#94a3b8">FREE DG MODE</text>

  <!-- Right Dashboards -->
  <rect x="420" y="80" width="520" height="150" rx="8" fill="#111827" stroke="#2e3b52"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#cbd5e1">AHRS INERTIAL STATES &amp; TURN COMPENSATION</text>
  
  <rect x="435" y="120" width="115" height="50" rx="4" fill="#070d18"/>
  <text x="455" y="145" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">270.0°</text>
  <text x="445" y="162" font-family="monospace" font-size="8" fill="#64748b">MAGNETIC HEADING</text>

  <rect x="560" y="120" width="115" height="50" rx="4" fill="#070d18"/>
  <text x="580" y="145" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">266.5°</text>
  <text x="570" y="162" font-family="monospace" font-size="8" fill="#64748b">TRUE HEADING</text>

  <rect x="685" y="120" width="115" height="50" rx="4" fill="#070d18"/>
  <text x="705" y="145" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">0.000 g</text>
  <text x="690" y="162" font-family="monospace" font-size="8" fill="#64748b">TURN ACCEL COMP</text>

  <rect x="810" y="120" width="115" height="50" rx="4" fill="#070d18"/>
  <text x="835" y="145" font-family="monospace" font-size="16" font-weight="bold" fill="#4ade80">ACTIVE</text>
  <text x="820" y="162" font-family="monospace" font-size="8" fill="#64748b">FLUX SLAVING</text>

  <text x="435" y="195" font-family="monospace" font-size="10" fill="#4ade80">&bull; Gyro Drift: &lt;= 1.5°/hr &bull; Fast Alignment Time: 45s (Complete)</text>
  <text x="435" y="212" font-family="monospace" font-size="10" fill="#4ade80">&bull; Turn Inhibit Cutoff: &gt; 6.0° Bank / &gt; 3.0°/s Yaw Rate</text>

  <!-- ARINC 429 Bus Words -->
  <rect x="420" y="245" width="520" height="275" rx="8" fill="#111827" stroke="#2e3b52"/>
  <text x="435" y="270" font-family="monospace" font-size="12" font-weight="bold" fill="#cbd5e1">ARINC 429 HIGH-SPEED ATTITUDE BUS (BIT 32 ODD PARITY)</text>
  
  <text x="435" y="295" font-family="monospace" font-size="11" fill="#4ade80">Label 324 (Pitch Angle)   : 0x600720D4  [P:0, Pitch: +2.50°]</text>
  <text x="435" y="320" font-family="monospace" font-size="11" fill="#4ade80">Label 325 (Roll Angle)    : 0x60000054  [P:0, Roll : 0.00°]</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#4ade80">Label 320 (Magnetic Hdg)  : 0xE005C014  [P:1, Mag  : 270.0°]</text>
  <text x="435" y="370" font-family="monospace" font-size="11" fill="#4ade80">Label 314 (True Heading)  : 0xE005B066  [P:1, True : 266.5°]</text>
  <text x="435" y="395" font-family="monospace" font-size="11" fill="#4ade80">Label 270 (AHRS Status)   : 0xE0007858  [P:1, Mode: SLAVED]</text>
  <text x="435" y="420" font-family="monospace" font-size="11" fill="#4ade80">Label 350 (BITE Word)     : 0x600000E8  [P:0, No Internal Fault]</text>

  <rect x="435" y="445" width="490" height="55" rx="4" fill="#030712" stroke="#1f2937"/>
  <text x="450" y="468" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">NORMATIVE AIRWORTHINESS AUDIT: 10/10 CRITERIA VERIFIED (100.0%)</text>
  <text x="450" y="488" font-family="monospace" font-size="10" fill="#cbd5e1">Complies with ARINC 705, RTCA DO-334, and FAA TSO-C4c/C6e/C8e.</text>
</svg>